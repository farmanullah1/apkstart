appId: com.apkstart.win
productName: ApkStart
copyright: Copyright © 2026 ApkStart

directories:
  output: dist/release
  buildResources: build

# Ship only the files needed at runtime; the source tree goes in whole (no asar: the window agent needs a real .ps1 path)
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Used at runtime to extract .xz images (prebuilt NAPI binary, no ABI issues)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Keep only English and Chinese UI locales (shrinks Electron locales from 41MB to ~3MB)
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW

# Full runtime (emulator + platform-tools + system image), generated by build/prepare-runtime.js.
# Once bundled, the first launch needs no downloads at all.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # Install into the current user profile: nothing written to system folders, no admin rights required
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store (MSIX) ----------------
# The appx target is not in the default build list: it is only used for Store packages (npm run build:appx),
# while npm run build:exe still produces only the NSIS installer.
#
# identityName / publisher must match Partner Center character for character →
#   under Product management → Product identity:
#   Package/Identity/Name and Package/Identity/Publisher.
# The two values below were copied from Partner Center and confirmed on 2026-11-16;
# Change them here when switching product identity (or set APKSTART_MSIX_IDENTITY / APKSTART_MSIX_PUBLISHER).
# Note: packages built with the placeholder Publisher (CN=farmanullah1) are rejected by the Store.
appx:
  identityName: farmanullah1.ApkStart
  publisher: "CN=58CA1DED-8AB3-4D0D-AF50-62C9B781AA4D"
  publisherDisplayName: farmanullah1
  displayName: ApkStart
  applicationId: ApkStart
  # The only capability a full-trust desktop app needs. Do not add unvirtualizedResources /
  # broadFileSystemAccess — the Store almost never approves them, and this app avoids
  # AppData write redirection by keeping its data directory in %USERPROFILE%\ApkStart, so it needs neither.
  capabilities:
    - runFullTrust
  languages:
    - en-US
    - zh-CN
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.22621.0

nsis:
  # No longer "install to the default C: folder with one click": a standard wizard lets the user pick a location
  # (installing off the system drive relieves C:; the runtime data directory is set separately in settings).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # always: rebuild the shortcut even when a .lnk with the same name already exists on the desktop.
  # The default true only creates it when missing, so on some machines (blocked by security software, desktop
  # redirected by OneDrive, or a stale shortcut from an older version pointing at a deleted folder) you end up with
  # no icon, or an icon still pointing at the old exe. always guarantees it points at the current install folder.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkStart-${version}-Setup.exe
  # Kill any running runtime process before uninstalling, so locked files can still be deleted
  # (bulk-delete tools often fail simply because qemu/adb are still resident).
  include: build/installer.nsh
  # The installer already contains the full runtime (emulator + compressed system image); on first launch
  # the image is expanded into the user profile, and nothing is downloaded afterwards.

# Compression: normal (zlib). The images are already xz/gz, so NSIS only compresses Electron DLLs;
# normal and maximum are almost the same size, while maximum (LZMA) makes packaging about ten minutes slower.
# Note: when CI runs npx from PowerShell, an inline -c.compression=xxx is split into arguments and treated as a config path,
# so the compression level is set here only, never overridden inline in the workflow.
compression: normal

# ---------------- Linux / FydeOS ----------------
# This block used to live in package.json under "build". electron-builder 26's schema
# no longer accepts that linux.desktop shape, so every build (Windows included) failed during
# config validation. Moving it into this file and passing --config electron-builder.yml
# explicitly means the stale package.json config can no longer take over.
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: ApkStart
      Comment: Manage Android apps on FydeOS / Linux
      Categories: Utility;
